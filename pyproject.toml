[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "namebump"
version = "0.0.8"
description = "Namebump is a registrationless, key-authenticated name registry where writes bump prior values."
readme = "README.md"
requires-python = ">=3.5"
license = {file = "LICENSE"}
authors = [
    {name = "Matthew Roberts"}
]
keywords = ["utility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = ["aionetiface", "ecdsa", "aiomysql"]

[project.urls]
Homepage = "https://github.com/robertsdotpm/namebump"